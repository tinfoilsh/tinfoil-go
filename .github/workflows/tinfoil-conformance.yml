name: Tinfoil Conformance

# Runs the cross-SDK Tinfoil conformance suite
# (https://github.com/tinfoilsh/tinfoil-conformance) against the
# tinfoil-conformance binary built from cmd/tinfoil-conformance/.
# Speaks the Tinfoil policy-layer CLI contract (JSON-in / JSON-out);
# distinct from the SDK Tests workflow which exercises the consumer-
# facing verifier API.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  conformance:
    name: Tinfoil Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tinfoil-conformance binary
        run: go build -o bin/tinfoil-conformance ./cmd/tinfoil-conformance/

      - name: Checkout tinfoil-conformance suite
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-conformance
          ref: main
          path: tinfoil-conformance
          persist-credentials: false

      - name: Set up Python for the harness
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tinfoil-conformance/harness/pyproject.toml

      - name: Install harness
        run: pip install ./tinfoil-conformance/harness

      - name: Show SDK capabilities
        run: |
          tinfoil-conformance capabilities \
            --sdk "tinfoil-go=${{ github.workspace }}/bin/tinfoil-conformance"

      - name: Run conformance vectors
        run: |
          tinfoil-conformance run \
            --sdk "tinfoil-go=${{ github.workspace }}/bin/tinfoil-conformance" \
            --vectors tinfoil-conformance/vectors/sigstore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinfoil-conformance-results
          path: results/

      - name: Append summary
        if: always()
        run: |
          if [ -f results/latest/results.md ]; then
            cat results/latest/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
