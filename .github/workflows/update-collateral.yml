name: Update Intel PCS Collateral

on:
  schedule:
    - cron: '32 9 * * 0'  # Weekly on Sunday at an arbitrary time
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-collateral:
    name: Update Collateral
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Fetch latest collateral from Intel PCS
        run: |
          cd verifier/attestation/collateral
          chmod +x fetch.sh
          ./fetch.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet verifier/attestation/collateral/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract tcbEvaluationDataNumber
        if: steps.changes.outputs.changed == 'true'
        id: tcb
        run: |
          TCB_NUM=$(jq -e '.enclaveIdentity.tcbEvaluationDataNumber' verifier/attestation/collateral/qe_identity.json)
          echo "tcb_num=$TCB_NUM" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "chore: update Intel PCS collateral (tcbEvaluationDataNumber: ${{ steps.tcb.outputs.tcb_num }})"
          title: "Update Intel PCS Collateral"
          body: |
            This PR updates the embedded Intel PCS collateral files used for TDX attestation verification.

            **Current tcbEvaluationDataNumber:** ${{ steps.tcb.outputs.tcb_num }}

            ## What changed
            - QE Identity
            - Root CA CRL
            - PCK CRLs (processor and platform)

            ## Action required
            If the `tcbEvaluationDataNumber` has increased significantly, consider updating `MinimumTcbEvaluationDataNumber` in `verifier/attestation/tdx.go`.

            ---
            *This PR was automatically generated by the update-collateral workflow.*
          branch: update-collateral
          delete-branch: true
          labels: |
            automated
            security
