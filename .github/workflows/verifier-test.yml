name: Verifier Tests

on:
  push:
    branches:
      - main
    paths:
      - 'verifier/**'
  pull_request:
    paths:
      - 'verifier/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      TINFOIL_API_KEY: ${{ secrets.TINFOIL_API_KEY }}
      TINFOIL_ENCLAVE: ${{ secrets.TINFOIL_ENCLAVE }}
      TINFOIL_REPO: ${{ secrets.TINFOIL_REPO }}
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: verifier/go.mod

      - run: |
          go env -w GOTOOLCHAIN=go1.25.0+auto
          go mod download
          go run ./rootfetch/main.go -o client/trusted_root.json
          go build -v ./...
          go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        run: |
          set -euo pipefail
          go test -p 1 -json -v -covermode atomic -coverprofile=cover.out ./... 2>&1 | tee /tmp/gotest.log | gotestsum --raw-command -f github-actions -- cat

      - name: Upload test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-test-log
          path: /tmp/gotest.log
          if-no-files-found: error
